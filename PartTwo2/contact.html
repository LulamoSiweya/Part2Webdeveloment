    <header>

    <main>
        <h1 class="contact">Request a Quote</h1>

        <form id="quoteForm">
            <label for="name">Name:</label>
            <input placeholder="Name" type="text" id="name" name="name" required>
            <br><br>

            <label for="surname">Surname:</label>
            <input placeholder="Surname" type="text" id="surname" name="surname" required>
            <br><br>

            <label for="email">Email:</label>
            <input placeholder="Email" type="email" id="email" name="email" required>
            <br><br>

            <label for="phone">Phone number:</label>
            <input placeholder="Phone" type="text" id="phone" name="phone" required>
            <br><br>

            <label for="message">Message:</label>
            <textarea placeholder="Message" id="message" name="message" required></textarea>
            <br><br>

            <button type="submit">Submit Form</button>
            <p class="fill-form">*Please fill all required form fields.</p>
        </form>

        <a href="https://wa.me/27606393755" target="_blank">WhatsApp</a>
